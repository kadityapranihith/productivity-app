<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="bp-logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2320" />
      <stop offset="100%" stop-color="#101211" />
    </linearGradient>
    <linearGradient id="bp-logo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FFA8" />
      <stop offset="50%" stop-color="#C5F36B" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
    <filter id="bp-logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C5F36B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Icon Mark Container -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="url(#bp-logo-bg)" stroke="#2E3530" stroke-width="1.5" />
    <g filter="url(#bp-logo-shadow)" transform="translate(-4, -4)">
      <!-- Baseline Anchor Path -->
      <path
        d="M17 45 L29 45 C31.76 45 34 42.76 34 40 L34 32 C34 29.24 36.24 27 39 27 L47 27"
        stroke="#3A463D"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Ascending Streak Path -->
      <path
        d="M17 37 C17 37 23 37 25 37 C27.76 37 30 34.76 30 32 L30 24 C30 21.24 32.24 19 35 19 L47 19"
        stroke="url(#bp-logo-glow)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <!-- Anchor Nodes -->
      <circle cx="17" cy="37" r="3.5" fill="#C5F36B" />
      <circle cx="47" cy="19" r="4.5" fill="#E2FFA8" />
    </g>
  </g>

  <!-- Typography -->
  <text x="74" y="32" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#F5F5F0" letter-spacing="-0.03em">
    Barely Productive
  </text>
  <text x="74" y="47" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#5A6B5D" letter-spacing="0.01em">
    Consistency over intensity
  </text>
</svg>

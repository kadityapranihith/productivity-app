<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2320" />
      <stop offset="100%" stop-color="#101211" />
    </linearGradient>
    <linearGradient id="bp-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FFA8" />
      <stop offset="50%" stop-color="#C5F36B" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
    <filter id="bp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C5F36B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bp-bg)" stroke="#2E3530" stroke-width="1.5" />

  <!-- Consistency Momentum Emblem: Stepped Streak Loop -->
  <g filter="url(#bp-shadow)">
    <!-- Baseline Anchor Path -->
    <path
      d="M17 45 L29 45 C31.76 45 34 42.76 34 40 L34 32 C34 29.24 36.24 27 39 27 L47 27"
      stroke="#3A463D"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Ascending Forward Momentum Primary Curve -->
    <path
      d="M17 37 C17 37 23 37 25 37 C27.76 37 30 34.76 30 32 L30 24 C30 21.24 32.24 19 35 19 L47 19"
      stroke="url(#bp-glow)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Momentum Anchor Pulse Nodes -->
    <circle cx="17" cy="37" r="3.5" fill="#C5F36B" />
    <circle cx="47" cy="19" r="4.5" fill="#E2FFA8" />
  </g>
</svg>
